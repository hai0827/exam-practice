<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目岗位新员工考试 · 答题练习</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --ok: #16a34a;
    --ok-bg: #f0fdf4;
    --bad: #dc2626;
    --bad-bg: #fef2f2;
    --border: #e5e7eb;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }

  header { text-align: center; padding: 12px 0 20px; }
  header h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: .5px; }
  header .sub { color: var(--muted); font-size: 13px; margin: 0; }

  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
  .tab {
    flex: 1 1 auto; min-width: 84px;
    padding: 9px 10px; text-align: center;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; cursor: pointer; user-select: none;
    transition: all .15s; font-size: 14px; color: var(--text);
  }
  .tab:hover { border-color: var(--primary); }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
  .tab .cnt { display: block; font-size: 11px; opacity: .75; margin-top: 1px; }

  .global { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; }
  .global .row { display: flex; align-items: center; gap: 10px; }
  .global .bar { flex: 1; height: 10px; background: #eef0f3; border-radius: 999px; overflow: hidden; }
  .global .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), #60a5fa); border-radius: 999px; transition: width .4s ease; }
  .global .label { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .global .label b { color: var(--text); }
  .reset { border: 1px solid var(--border); background: #fff; color: var(--muted); font-size: 12px; padding: 5px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .reset:hover { color: var(--bad); border-color: var(--bad); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 18px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .q-type { font-size: 12px; color: var(--primary); background: #eff6ff; padding: 3px 10px; border-radius: 999px; font-weight: 600; }
  .q-progress { font-size: 12px; color: var(--muted); }
  .question { font-size: 16px; font-weight: 500; margin-bottom: 18px; white-space: pre-wrap; }
  .question .blank { display: inline-block; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px;
    cursor: pointer; transition: all .12s; background: #fff;
  }
  .opt:hover { border-color: var(--primary); background: #f8faff; }
  .opt input { margin-top: 4px; }
  .opt-letter { font-weight: 700; color: var(--primary); min-width: 18px; }
  .opt-text { flex: 1; }
  .opt.correct-opt { border-color: var(--ok); background: var(--ok-bg); }
  .opt.wrong-opt { border-color: var(--bad); background: var(--bad-bg); }

  .fill-line { margin-bottom: 12px; font-size: 14px; }
  .fill-input {
    width: 100%; margin-top: 4px; padding: 10px 12px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  .fill-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .fill-input.correct { border-color: var(--ok); background: var(--ok-bg); }
  .fill-input.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .qa-area textarea {
    width: 100%; min-height: 90px; padding: 10px 12px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px; resize: vertical; outline: none; font-family: inherit;
  }
  .qa-area textarea:focus { border-color: var(--primary); }

  .actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    border: none; cursor: pointer; font-size: 14px; padding: 11px 22px;
    border-radius: 10px; font-weight: 600; transition: all .12s; font-family: inherit;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }
  .btn-ghost { background: #fff; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
  .btn-ok { background: var(--ok); color: #fff; }
  .btn-ok:hover { filter: brightness(1.05); }
  .btn-bad { background: #fff; color: var(--bad); border: 1px solid var(--bad); }
  .btn-bad:hover { background: var(--bad-bg); }

  .result { margin-top: 16px; border-radius: 10px; padding: 14px 16px; display: none; }
  .result.show { display: block; }
  .result.ok { background: var(--ok-bg); border: 1px solid #bbf7d0; }
  .result.bad { background: var(--bad-bg); border: 1px solid #fecaca; }
  .result .head { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .result.ok .head { color: var(--ok); }
  .result.bad .head { color: var(--bad); }
  .result .answer { font-size: 14px; }
  .result .answer .a { color: var(--ok); font-weight: 600; }
  .result .ref { margin-top: 8px; padding: 10px 12px; background: #fff; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: #374151; max-height: 300px; overflow-y: auto; white-space: pre-wrap; }

  .next-wrap { margin-top: 16px; text-align: center; display: none; }
  .next-wrap.show { display: block; }

  .done { text-align: center; padding: 40px 10px; }
  .done .big { font-size: 40px; margin-bottom: 10px; }
  .done h2 { margin: 0 0 8px; }
  .done p { color: var(--muted); }

  @media (max-width: 520px) {
    .app { padding: 12px 10px 50px; }
    header h1 { font-size: 19px; }
    .tab { min-width: 70px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>项目岗位新员工考试 · 答题练习</h1>
    <p class="sub">共 <span id="totalCount"></span> 题 · 答错自动重出，直到答对才计入进度</p>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="global">
    <div class="row">
      <span class="label">总进度 <b id="globalText">0 / 0</b></span>
      <div class="bar"><i id="globalBar" style="width:0%"></i></div>
      <button class="reset" id="resetBtn">重置</button>
    </div>
  </div>

  <div class="card" id="card"></div>
</div>

nks":[]},{"type":"judge","question":"依据《建筑施工安全检查标准》，安装高度超过30m的物料提升机必须使用附墙架。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"依据《建筑施工塔式起重机安装、使用、拆卸安全技术规程》，塔式起重机的自由端高度应符合规定要求，拆卸时应先降节、后拆除附着装置。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"依据《建筑施工安全检查标准》，基坑工程开挖深度超过3m及以上的基坑周边必须安装防护栏杆，防护栏杆的安装应符合规范要求。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"依据《建筑施工塔式起重机安装、使用、拆卸安全技术规程》，零星材料起吊时，可不必用吊笼或钢丝绳绑扎牢固。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"依据《建筑施工安全检查标准》，架体搭设完成后应进行安全技术交底。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"依据《建筑施工安全检查标准》，架体必须设置符合规范要求的上下通道","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"依据《建筑施工安全检查标准》，型钢、钢管弯曲、变形、锈蚀应在规范允许范围内。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"依据《施工脚手架通用规范》，在搭设和拆除脚手架作业时，应设置安全警戒线、警戒标志，并应由专人监护，严禁非作业人员入内。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"依据《施工脚手架通用规范》，脚手架搭设和拆除作业前，应将脚手架专项施工方案向施工现场管理人员及作业人员进行安全技术交底","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"气瓶应远离火源，并应采取避免高温和防止曝晒的措施 （   ）","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"在发生火灾的时候，只要火势不大就可以先不逃生。（  ）","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"为避免消防箱内器材被盗，可以采取上锁措施。（  ）","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"在清洗消防水箱的过程中，涉及受限空间作业，应严格按照受限空间施工作业流程开展工作。（ ）","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"根据《机械设备安全管理办法》，机械设备档案由项目部机械工程师建立（）。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"依据《施工现场安全管理办法》，工作面移交时，项目专业工程师组织相关单位办理安全防护设施移交手续，项目安全工程师过程监督","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"根据《安全生产教育培训办法》，班组长应在每天作业前组织本班组作业人员开展一次安全培训。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"隐患一定是危险源，危险源也一定是隐患","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"生活区、办公区、库房等房建内必须安装智慧消防报警系统，消防报警推送报警信息的顺序为项目经理、生产经理、现场常驻值守人员。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"依据《安全生产法》，从业人员发现直接危及人身安全的紧急情况时，有权停止作业或者在采取可能的应急措施后撤离作业场所。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"依据《安全生产法》，生产经营单位使用被派遣劳动者的，不必对被派遣劳动者进行岗位安全操作规程和安全操作技能的教育和培训。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"碗扣式钢管脚手架拆除应派专人指挥，多人同时操作时应明确分工，统一行动。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"在影响碗扣式钢管脚手架地基的安全范围内禁止进行挖掘作业。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"碗扣式钢管脚手架上进行焊接作业时可无人监护。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"碗扣式钢管脚手架作业层上的施工荷载不得超过设计允许荷载。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"承插型盘扣式脚手架基础影响范围内可进行挖掘作业，但应提前交底。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"承插型盘扣式脚手架的连墙件宜采用菱形布置，也可采用矩形布置。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"承插型盘扣式脚手架的连墙点应均匀分布。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"剪刀撑斜杆应用旋转扣件固定在与之相交的横向水平杆的伸出端或立杆上，旋转扣件中心线至主节点的距离不应大于 100mm。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"高度在24m 及以上的双排脚手架应在外侧 全立面连续设置剪刀撑 ；高度在 24m 以下的单、双排脚手架，均必须在外侧 两端、转角及中间间隔不超过 15m 的立面上，各设置一道剪刀撑，并应由底至顶连续设置。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"施工升降机的安装作业，当遇大雨、大雪、大雾或风速大于13m/s等恶劣天气时，应停止安装作业。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"施工升降机安装作业时必须将按钮盒或操作盒移至吊笼顶部操作。当导轨架或附墙架上有人员作业时，严禁开动施工升降机。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"施工升降机的安装单位应对施工升降机司机进行书面安全技术交底，交底资料应留存备查。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"严禁施工升降机使用超过有效标定期的防坠安全器。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"吊钩设有防止吊索或吊具非人为脱出的装置（吊钩防脱钩装置），其作用是防止塔式起重机在吊运重物的过程中，吊索从吊钩中滑脱导致重物坠落∶检验时如有异常小问题也可继续使用。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"电动机在正常运行中，可以突然进行反向运转。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"起重机的吊钩和吊环可以补焊。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"人员不得在悬挑式操作平台吊运、安装时上下。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"交叉作业时，坠落半径内应设置安全防护棚或安全防护网等安全隔离措施。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"移动式操作平台行走轮和导向轮可不配备制动器或刹车闸等制动措施。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"移动式操作平台移动时，操作平台上必须站人观察情况。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"自然接地体是指施工后埋入地下并可兼作接地用的金属物体。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"配电室的顶栅与地面的距离不低于3m。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"开关箱与用电设备之间可以实行“一闸多机”制。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"移动式配电箱、开关箱的进、出线应采用橡皮护套绝缘电缆,不得有接头。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"固定式配电箱、开关箱的中心点与地面的垂直距离应为1.4~1.6m。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"移动式配电箱、开关箱应装设在坚固、稳定的支架上。其中心点与地面的垂直距离宜 为1~1.2m。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"配电箱、开关箱应采用冷轧钢板或阻燃绝缘材料制作,钢板厚度应为1.0~1.5mm。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"每台用电设备必须有各自专用的开关箱,严禁用同一个开关箱直接控制2台及2台以上用电设备(含插座)。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"配电系统应设置配电柜或总配电箱、分配电箱、开关箱, 实行三级配电。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"配电箱、开关箱必须按照下列顺序操作停电操作顺序为: 总配电箱→分配电箱→开关箱。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"配电箱、开关箱必须按照下列顺序操作送电操作顺序为: 开关箱→分配电箱→总配电箱。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"施工现场停止作业8小时以上时,应将动力开关箱断电上锁。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"有爆炸和火灾危险的场所,按危险场所等级选用防尘型照明器。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"手持式电动工具的负荷线应按其计算负荷选用无接头的橡皮护套铜芯软电缆。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"一般场所宜选用额定电压为220V 的照明器。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"潮湿和易触及带电体场所的照明，电源电压不得大于 12V。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"特别潮湿场所、导电良好的地面、锅炉或金属容器内的照明,电源电压不得大于24V;","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"室外220V灯具距地面不得低于2.5m。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"室内220V灯具距地 面不得低于3m。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"高处作业吊篮应设置作业人员专用的挂设安全带的安全绳及安全锁扣。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"在高处作业吊篮内的作业人员，应佩戴安全帽、系安全带，并将安全锁扣正确挂置在安全绳上。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"安全带中使用的金属环类零件不应使用焊接件，可以留有开口。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"安全带中使用的金属环类零件可以使用焊接件，不应留有开口。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"安全网是指用来防止人、物坠落，或用来避免、减轻坠落及物击伤害的网具。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"安全平网是指用来防止人、物坠落，或用来避免、减轻坠落及物击伤害的安全网。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"攀登作业时，供人上下的踏板，其负荷能力即使用荷载，不应大于1000N。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"操作平台投入使用时，要在操作平台上显著位置标明它所允许的荷载值。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"施工现场立体交叉作业时，下层作业的位置，应处于坠落半径之内。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"施工现场分配电箱应设在用电设备或负荷相对分散的区域。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"特别潮湿场所、导电良好的地面、锅炉或金属容器内的照明，电源电压不得大于24V。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"塔式起重机的起重量大于相应档位的额定值并小于该额定值的110%时，应切断上升和下降方向上的电源，机构不可以运动。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"施工现场不得使用同台电机驱动多种刃具、钻具的多功能木工机具。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"电焊机一次线长度不得超过10m，并应穿管保护。","options":[],"answer":"错误","blanks":[]},{"type":"judge","question":"施工现场配电系统应采用三级配电、二级漏电保护系统，用电设备必须有各自专用的开关箱。","options":[],"answer":"正确","blanks":[]},{"type":"judge","question":"脚手架架体应设置纵、横向扫地杆，并应用直角扣件固定在立杆上，纵向扫地杆应设置在横向扫地 :"qa","question":"《施工现场员工六条保命法则》的内容包括哪些？","options":[],"answer":"（1）主动参加安全教育和安全技术交底（2）正确使用个人劳动防护用品（3）在安全通道和规定线路行走（4）受限空间作业和动火作业时应有人监护（5）持特种作业资格证才能从事特种作业（6）当发现可能对自己或他人的生命健康产生损害的隐患时应立即停工并向上级报告","blanks":[]},{"type":"qa","question":"安全技术交底内容应包括哪些？","options":[],"answer":"（1）工作内容、范围和作业环境条件；（2）施工工序、工艺操作方法、作业特点、交叉施工的安排及协调；（3）危险源以及可能发生的事故；（4）安全技术操作规程；（5）应急处置措施及应急响应流程；（6）其他应注意事项。","blanks":[]},{"type":"qa","question":"项目周安全检查下发隐患整改通知单的要求包括哪些？","options":[],"answer":"①整改通知单应对检查发现的隐患进行详细描述，并注明发生的部位；②应注明不符合的相关条款及要求；③应按“定人、定时间、定措施”的原则提出具体要求，明确整改责任人（整改责任人一律为辖区范围的专业工程师）、复查责任人（复查验证的责任人一律为项目安全总监）；④应规定整改结束后申请复查的最迟报告时间；⑤专业工程师应将要求整改的内容书面下达给辖区范围的劳务分包或专业承包单位负责人，双方履行签字手续。","blanks":[]},{"type":"qa","question":"请简述局最新版本的十项“零容忍”安全隐患。","options":[],"answer":"工人未经入场安全教育或安全技术交底临时消防设施缺失临边及交叉作业无可靠防护高处作业人员未系挂安全带危大工程未按方案施工危险作业未按要求实施流动式起重机安全装置失效高空作业平台未按要求验收并使用 重要辅材未经验收合格投入使用中建智慧安全平台应用与实际管理动作不符","blanks":[]},{"type":"qa","question":"根据局十项“零容忍”安全隐患认定标准，请简述高处作业人员未系挂安全带的认定标准包括哪些？","options":[],"answer":"1、3 名及以上人员使用的安全带不符合作业类型，存在质量缺陷未及时报废的；2、高处作业的人员未佩戴安全带的;未将安全带系挂在牢固可靠处的；高处作业区域安全带无有效系挂点的；3、涉及洞口临边作业未正确使用安全带的，按照集团重大事故隐患判定标准进行判定。","blanks":[]},{"type":"qa","question":"简述公司《安全施工管理手册》中规定的动火作业“四不动火”是指？","options":[],"answer":"项目部必须实行三级动火管理，必须做到“四不动火”，即：没有签发动火证不动火；没有消防措施或动火措施未落实不动火；没有动火监护人不动火；动火部位、动火人、动火时间与动火证不符不动火。","blanks":[]},{"type":"qa","question":"中建八局《机械设备安全管理办法》中，规定的一类机械设备有哪些？","options":[],"answer":"塔式起重机、施工升降机、物料提升机、汽车式起重机、轮胎式起重机、履带式起重机、轨道式起重机、门式起重机、桥式起重机、架桥机、提梁机、电动葫芦、桅杆式起重机、缆索式起重机、浮吊、盾构机、顶管机等","blanks":[]},{"type":"qa","question":"“四凡四必”工作要求的总体要求中，“三个覆盖”和“六个到位”分别指的是什么？","options":[],"answer":"1、三覆盖：覆盖所有分包、覆盖所有班组、覆盖所有作业或活动。2、六个到位：确保所有作业计划到位、所有风险辨识到位、所有作业审批到位、所有管控措施交底到位、所有作业环境确认和条件验收到位、所有作业旁站或巡查到位。","blanks":[]},{"type":"qa","question":"请简述安全检查“三有”原则的定义。","options":[],"answer":"每次例行安全检查都应事先制定检查策划，检查结束后应形成书面总结材料，并在受检单位组织召开检查讲评会进行反馈","blanks":[]},{"type":"qa","question":"请简述安全检查“三必”原则的定义。","options":[],"answer":"每次安全检查必须检查各级安全总监和安全工程师的《安全监督日志》填写情况，必须按照十项“零容忍”安全隐患清单及重大事故隐患判定标准进行排除式检查，检查过程中必须做好检查记录","blanks":[]},{"type":"qa","question":"局重大事故隐患排查整治“五必须”","options":[],"answer":"(1)各级安全检查必须排查重大事故隐患(2)排查出的重大事故隐患必须第一时间通知下级单位主要负责人(3)主要负责人必须第一时间组织整改(4)必须查清隐患产生的根本原因及在责任人(5)必须参照事故开展责任追究","blanks":[]},{"type":"qa","question":"描述“三宝四口五临边”中的“五临边”包括哪些部位？","options":[],"answer":"沟、坑、槽和深基础周边，楼层周边，楼梯侧边，平台或阳台边，屋面周边","blanks":[]},{"type":"qa","question":"描述“四不两直”的具体内容。","options":[],"answer":"(1)不发通知(2)不打招呼(3)不听汇报(4)不用陪同接待(5)直奔基层(6)直插现场","blanks":[]},{"type":"qa","question":"描述“四不伤害”的具体内容。","options":[],"answer":"(1)不伤害自己(2)不伤害他人(3)不被他人伤害(4)保护他人不受伤害","blanks":[]},{"type":"qa","question":"公司“七项强制做法”中，涉及到的机械设备除汽车吊外还包括那些？并描述针对机械设备的强制做法实施标准。","options":[],"answer":"1、汽车泵、随车吊、打桩设备、履带吊2、1）汽车吊、汽车泵、随车吊、桩机等支腿式架设设备，下垫钢板短边长度大于1m、厚度大于10mm；枕木面积不小于支腿底座面积的3倍且支腿无悬空；支腿限位合格线可采取张贴或喷涂措施（桩机支腿下仅需垫设钢板）。2）绘制机械设备行走路线图，标明行走路线、作业位置最大允许载荷值、机械设备最大型号，并随工程进度实时更新。","blanks":[]},{"type":"qa","question":"集团“五重点一关键”中“五重点”分别是那些？","options":[],"answer":"重点区域重点领域重点单位重点项目重点时段","blanks":[]},{"type":"qa","question":"二级单位安全总监“六个强化”工作任务都有什么？","options":[],"answer":"(1)强体系(2)强意识(3)强辨识(4)强监督(5)强服务(6)强应急","blanks":[]},{"type":"qa","question":"描述局关于领导带班检查的“一问、二到、三查”要求","options":[],"answer":"(1)一问:询问现场重大风险及措施、近期上级安全工作部署落实情况(2)二到:必须到最高处作业面，必须到最低处地下室(3)三查:查安全履职、查安全行为、查安全环境","blanks":[]},{"type":"qa","question":"写出“四凡四必”的内容？","options":[],"answer":"（1）凡作业必计划（2）凡作业必辨识（3）凡作业必审批（4）凡作业必交底","blanks":[]},{"type":"qa","question":"局“3211”检查机制中，“3”是三级总部联动【局（分局）、公司、分公司】，前后方协同，分别写出“2”“1”“1”所代表的含义。","options":[],"answer":"（1）“2”是聚焦重大事故隐患和十项“零容忍”隐患；（2）“1”是每日召开检查研讨会；（3）“1”是形成一系列典型案例。","blanks":[]},{"type":"qa","question":"新员工学习、实践任务清单“4911”中，4项学习内容指的是哪四项？","options":[],"answer":"1）学习建筑施工安全生产相关法律法规、标准规范及公司相关制度、图集文件；2）完成八一e学中新员工日常安全教育培训（48学时）；3）学习新版《安全施工管理手册》；4）学习公司安全生产相关制度文件、隐患图集等。","blanks":[]}]};</script>
<script>
(function () {
  "use strict";

  var Q = window.QUESTIONS;
  var SECTIONS = [
    { key: "single",   name: "单选题" },
    { key: "multiple", name: "多选题" },
    { key: "judge",    name: "判断题" },
    { key: "fill",     name: "填空题" },
    { key: "qa",       name: "问答题" }
  ];
  var LETTERS = "ABCDEFG";
  var TOTAL = SECTIONS.reduce(function (s, x) { return s + Q[x.key].length; }, 0);

  var state = { section: "single", current: null, answered: false };

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function normalize(s) {
    return String(s == null ? "" : s)
      .replace(/\s+/g, "")
      .toLowerCase()
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[Ａ-Ｚ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[ａ-ｚ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[，。；：、]/g, function (c) { return { "，": ",", "。": ".", "；": ";", "：": ":", "、": "," }[c]; })
      .replace(/[（]/g, "(").replace(/[）]/g, ")")
      .replace(/[《》]/g, "");
  }

  /* ---------- 进度持久化 ---------- */
  function keyOf(section) { return "exam_mastered_" + section; }
  function loadMastered(section) {
    try { return new Set(JSON.parse(localStorage.getItem(keyOf(section)) || "[]")); }
    catch (e) { return new Set(); }
  }
  function saveMastered(section, set) {
    localStorage.setItem(keyOf(section), JSON.stringify(Array.from(set)));
  }

  function sectionProgress(section) {
    var list = Q[section];
    var m = loadMastered(section);
    return { done: m.size, total: list.length, set: m };
  }
  function globalProgress() {
    var done = 0;
    SECTIONS.forEach(function (s) { done += loadMastered(s.key).size; });
    return { done: done, total: TOTAL };
  }

  /* ---------- 渲染 ---------- */
  function renderTabs() {
    var html = "";
    SECTIONS.forEach(function (s) {
      var p = sectionProgress(s.key);
      var pct = p.total ? Math.round(p.done / p.total * 100) : 0;
      html += '<div class="tab' + (state.section === s.key ? " active" : "") + '" data-key="' + s.key + '">' +
        s.name + '<span class="cnt">' + p.done + "/" + p.total + " · " + pct + "%</span></div>";
    });
    document.getElementById("tabs").innerHTML = html;
  }

  function renderGlobal() {
    var g = globalProgress();
    var pct = g.total ? (g.done / g.total * 100) : 0;
    document.getElementById("totalCount").textContent = g.total;
    document.getElementById("globalText").innerHTML = g.done + " / " + g.total;
    document.getElementById("globalBar").style.width = pct + "%";
  }

  function pickQuestion() {
    var list = Q[state.section];
    var p = sectionProgress(state.section);
    var pool = [];
    for (var i = 0; i < list.length; i++) if (!p.set.has(i)) pool.push(i);
    if (pool.length === 0) { state.current = null; return; }
    var idx = pool[Math.floor(Math.random() * pool.length)];
    state.current = { idx: idx, q: list[idx] };
    state.answered = false;
  }

  function renderCard() {
    var card = document.getElementById("card");
    if (!state.current) {
      card.innerHTML = '<div class="done"><div class="big">🎉</div><h2>' +
        esc(SECTIONS.filter(function (s) { return s.key === state.section; })[0].name) +
        '已全部答对！</h2><p>切换到其他板块继续练习吧。</p></div>';
      return;
    }
    var q = state.current.q;
    var p = sectionProgress(state.section);
    var typeName = SECTIONS.filter(function (s) { return s.key === state.section; })[0].name;

    var html = "";
    html += '<div class="q-meta"><span class="q-type">' + typeName + ' #' + (state.current.idx + 1) + '</span>' +
      '<span class="q-progress">已掌握 ' + p.done + ' / ' + p.total + '</span></div>';

    if (q.type === "judge") {
      html += '<div class="question">' + esc(q.question) + '</div>';
      html += '<div class="actions">' +
        '<button class="btn btn-ok" id="judgeTrue">✓ 正确</button>' +
        '<button class="btn btn-bad" id="judgeFalse">✗ 错误</button>' +
        '</div>';
    } else if (q.type === "fill") {
      html += '<div class="question">' + renderFillQuestion(q) + '</div>';
      html += '<div class="actions"><button class="btn btn-primary" id="submitBtn">提交答案</button>' +
        '<button class="btn btn-ghost" id="skipBtn">换一题</button></div>';
    } else if (q.type === "qa") {
      html += '<div class="question">' + esc(q.question) + '</div>';
      html += '<div class="qa-area"><textarea id="qaInput" placeholder="（可选）先写下你的答案要点，用于对照……"></textarea></div>';
      html += '<div class="actions"><button class="btn btn-primary" id="showRefBtn">显示参考答案</button>' +
        '<button class="btn btn-ghost" id="skipBtn">换一题</button></div>';
    } else {
      html += '<div class="question">' + esc(q.question) + '</div>';
      html += '<div class="options" id="options">' + renderOptions(q) + '</div>';
      html += '<div class="actions"><button class="btn btn-primary" id="submitBtn">提交答案</button>' +
        '<button class="btn btn-ghost" id="skipBtn">换一题</button></div>';
    }

    html += '<div class="result" id="result"></div>';
    html += '<div class="next-wrap" id="nextWrap"><button class="btn btn-primary" id="nextBtn">下一题 →</button></div>';
    card.innerHTML = html;

    bindCardEvents(q);
  }

  function renderOptions(q) {
    var html = "";
    for (var i = 0; i < q.options.length; i++) {
      var L = LETTERS[i];
      var type = q.type === "multiple" ? "checkbox" : "radio";
      html += '<label class="opt" data-letter="' + L + '">' +
        '<input type="' + type + '" name="opt" value="' + L + '">' +
        '<span class="opt-letter">' + L + '</span>' +
        '<span class="opt-text">' + esc(q.options[i]) + '</span></label>';
    }
    return html;
  }

  function renderFillQuestion(q) {
    var blanks = q.blanks || [];
    var idx = 0;
    var text = esc(q.question).replace(/【[^】]*】|__\s*[（(]\s*\d+\s*[)）]\s*__/g, function () {
      return '<input class="fill-input" data-idx="' + (idx++) + '" placeholder="第 ' + idx + ' 空" />';
    });
    var extra = "";
    while (idx < blanks.length) {
      extra += '<div class="fill-line">补充第 ' + (idx + 1) + ' 空：<input class="fill-input" data-idx="' + (idx++) + '" /></div>';
    }
    return text + extra;
  }

  function bindCardEvents(q) {
    var submit = document.getElementById("submitBtn");
    if (submit) submit.addEventListener("click", submitChoice);
    var skip = document.getElementById("skipBtn");
    if (skip) skip.addEventListener("click", function () { pickQuestion(); renderCard(); });

    var next = document.getElementById("nextBtn");
    if (next) next.addEventListener("click", function () { pickQuestion(); renderCard(); });

    var jt = document.getElementById("judgeTrue");
    var jf = document.getElementById("judgeFalse");
    if (jt) jt.addEventListener("click", function () { answerJudge("正确"); });
    if (jf) jf.addEventListener("click", function () { answerJudge("错误"); });

    var sr = document.getElementById("showRefBtn");
    if (sr) sr.addEventListener("click", function () { showRef(q); });
  }

  /* ---------- 判定 ---------- */
  function markChoice(choice) {
    var q = state.current.q;
    if (q.type === "single") {
      var correct = choice === q.answer;
      highlightOptions(q.answer, choice);
      showResult(correct, "正确答案：" + q.answer);
    } else if (q.type === "multiple") {
      var ans = q.answer.split("");
      var sel = choice.sort().slice();
      var correct = ans.length === sel.length && ans.slice().sort().every(function (a, i) { return a === sel[i]; });
      highlightOptions(q.answer, choice);
      showResult(correct, "正确答案：" + q.answer);
    }
  }

  function submitChoice() {
    if (state.answered) return;
    var q = state.current.q;
    if (q.type === "fill") { submitFill(); return; }

    var sels = Array.prototype.slice.call(document.querySelectorAll('input[name="opt"]:checked'))
      .map(function (x) { return x.value; });
    if (sels.length === 0) { alert(q.type === "multiple" ? "请至少选择一个选项" : "请先选择一个选项"); return; }
    markChoice(sels.length === 1 ? sels[0] : sels);
  }

  function highlightOptions(correctLetters, chosen) {
    document.querySelectorAll(".opt").forEach(function (el) {
      var L = el.getAttribute("data-letter");
      if (correctLetters.indexOf(L) >= 0) el.classList.add("correct-opt");
      else if (chosen && chosen.indexOf(L) >= 0) el.classList.add("wrong-opt");
    });
  }

  function answerJudge(choice) {
    if (state.answered) return;
    var q = state.current.q;
    var correct = choice === q.answer;
    showResult(correct, "正确答案：" + q.answer);
  }

  function submitFill() {
    if (state.answered) return;
    var q = state.current.q;
    var blanks = q.blanks || [];
    var inputs = Array.prototype.slice.call(document.querySelectorAll(".fill-input"));
    var allCorrect = true;
    var detail = [];
    inputs.forEach(function (inp, i) {
      var ans = blanks[i] || "";
      var ok = normalize(inp.value) === normalize(ans);
      if (!ok) allCorrect = false;
      inp.classList.add(ok ? "correct" : "wrong");
      inp.disabled = true;
      detail.push((i + 1) + ". " + ans);
    });
    var msg = allCorrect ? "全部填写正确！" : "正确答案：<br>" + detail.map(function (d) { return esc(d); }).join("<br>");
    showResult(allCorrect, msg);
  }

  function showRef(q) {
    if (state.answered) return;
    var result = document.getElementById("result");
    result.className = "result show";
    result.innerHTML = '<div class="head">参考答案</div><div class="ref">' + esc(q.answer) + '</div>';

    var actions = document.querySelector(".qa-area");
    if (actions) actions.style.display = "none";
    var showBtn = document.getElementById("showRefBtn");
    if (showBtn) showBtn.remove();

    // 自评按钮
    var wrap = document.querySelector(".card .actions");
    if (wrap) {
      var b1 = document.createElement("button");
      b1.className = "btn btn-ok"; b1.textContent = "我答对了";
      b1.addEventListener("click", function () { finishSelfMark(true); });
      var b2 = document.createElement("button");
      b2.className = "btn btn-bad"; b2.textContent = "我没答对";
      b2.addEventListener("click", function () { finishSelfMark(false); });
      wrap.appendChild(b1); wrap.appendChild(b2);
    }
  }

  function finishSelfMark(correct) {
    if (state.answered) return;
    state.answered = true;
    var q = state.current.q;

    if (correct) {
      var p = sectionProgress(state.section);
      p.set.add(state.current.idx);
      saveMastered(state.section, p.set);
    }

    var result = document.getElementById("result");
    result.className = "result show " + (correct ? "ok" : "bad");
    result.innerHTML = '<div class="head">' + (correct ? "✓ 回答正确" : "✗ 回答错误") + '</div>' +
      '<div class="answer">' + (correct ? "很好，已计入进度。" : "已标记为答错，本题会再次出现。") + '</div>' +
      '<div class="ref">' + esc(q.answer) + '</div>';

    var wrap = document.querySelector(".card .actions");
    if (wrap) wrap.innerHTML = "";
    document.getElementById("nextWrap").classList.add("show");
    renderTabs();
    renderGlobal();
  }

  /* ---------- 结果与进度 ---------- */
  function showResult(correct, msg) {
    if (state.answered) return;
    state.answered = true;
    var q = state.current.q;

    if (correct) {
      var p = sectionProgress(state.section);
      p.set.add(state.current.idx);
      saveMastered(state.section, p.set);
    }

    var result = document.getElementById("result");
    result.className = "result show " + (correct ? "ok" : "bad");
    result.innerHTML = '<div class="head">' + (correct ? "✓ 回答正确" : "✗ 回答错误") + '</div>' +
      '<div class="answer">' + msg + "</div>";

    // 禁用选项/输入
    document.querySelectorAll('input[name="opt"], .fill-input').forEach(function (el) { el.disabled = true; });
    var submit = document.getElementById("submitBtn"); if (submit) submit.disabled = true;
    var jt = document.getElementById("judgeTrue"); if (jt) jt.disabled = true;
    var jf = document.getElementById("judgeFalse"); if (jf) jf.disabled = true;

    document.getElementById("nextWrap").classList.add("show");
    renderTabs();
    renderGlobal();
  }

  /* ---------- 事件绑定 ---------- */
  function bindTabs() {
    document.getElementById("tabs").addEventListener("click", function (e) {
      var t = e.target.closest(".tab");
      if (!t) return;
      state.section = t.getAttribute("data-key");
      pickQuestion();
      renderTabs();
      renderCard();
    });
  }

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (!confirm("确定要重置所有板块的答题进度吗？")) return;
    SECTIONS.forEach(function (s) { localStorage.removeItem(keyOf(s.key)); });
    pickQuestion();
    renderTabs();
    renderGlobal();
    renderCard();
  });

  /* ---------- 启动 ---------- */
  document.getElementById("totalCount").textContent = TOTAL;
  bindTabs();
  pickQuestion();
  renderTabs();
  renderGlobal();
  renderCard();
})();
</script>
</body>
</html>
